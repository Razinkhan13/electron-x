<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electron-X | Autonomous EV Empire Bangladesh</title>
    <!-- CSS & Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px; width: 20px; border-radius: 50%; background: #06b6d4; cursor: pointer;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        
        // Lucide Icon Component Wrapper
        const Icon = ({ name, className }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const App = () => {
            const [monthlyKm, setMonthlyKm] = useState(1800);
            const [activeTab, setActiveTab] = useState('economics');
            const [agentIdx, setAgentIdx] = useState(0);

            // Market Data
            const DATA = { petrol: 125, electricity: 12, iceMaint: 1200, evMaint: 150 };

            const savings = useMemo(() => {
                const petrol = (monthlyKm / 40) * DATA.petrol + DATA.iceMaint;
                const ev = (monthlyKm / 35) * DATA.electricity + DATA.evMaint;
                return { 
                    monthly: Math.round(petrol - ev), 
                    yearly: Math.round((petrol - ev) * 12) 
                };
            }, [monthlyKm]);

            const swarm = [
                { name: "Sentinel-1", role: "Market Scout", desc: "Mines 5,000+ leads from social sentiment AI.", tech: "Python/Llama 3" },
                { name: "Nexus-AI", role: "Sales Closer", desc: "Handles 1,000+ WhatsApp leads via GPT-4o.", tech: "OpenAI/Twilio" },
                { name: "Guardian", role: "Fleet Monitor", desc: "Predicts battery health via IoT sensors.", tech: "TensorFlow" }
            ];

            return (
                <div className="min-h-screen text-slate-100 pb-20">
                    {/* Navigation */}
                    <nav className="fixed top-0 w-full z-50 glass border-b border-white/5 h-20 px-6 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-cyan-500 rounded-xl flex items-center justify-center shadow-lg shadow-cyan-500/30">
                                <Icon name="zap" className="text-black w-6 h-6" />
                            </div>
                            <span className="text-xl font-black tracking-tighter uppercase">Electron<span className="text-cyan-500">X</span></span>
                        </div>
                        <div className="hidden md:flex gap-8 text-[10px] font-black tracking-widest text-slate-400">
                            <button onClick={() => setActiveTab('economics')} className={activeTab === 'economics' ? 'text-cyan-400' : ''}>ECONOMICS</button>
                            <button onClick={() => setActiveTab('swarm')} className={activeTab === 'swarm' ? 'text-cyan-400' : ''}>AGI SWARM</button>
                            <button onClick={() => setActiveTab('roadmap')} className={activeTab === 'roadmap' ? 'text-cyan-400' : ''}>ROADMAP</button>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <header className="pt-40 px-6 text-center mb-24 max-w-5xl mx-auto">
                        <div className="inline-flex items-center gap-2 px-3 py-1 bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 text-[10px] font-black rounded-full mb-6">
                            <Icon name="activity" className="w-3 h-3" /> LIVE FROM DHAKA/SYLHET
                        </div>
                        <h1 className="text-6xl md:text-8xl font-black tracking-tighter mb-8 leading-[0.8] uppercase italic">
                            Zero Capital.<br/><span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-emerald-400">Total Dominance.</span>
                        </h1>
                        <p className="text-slate-400 text-lg max-w-2xl mx-auto">
                            Transforming the ৳125/L fuel crisis into an autonomous business empire. We trade AGI intelligence for physical capital.
                        </p>
                    </header>

                    {/* Economics Section */}
                    {activeTab === 'economics' && (
                        <section className="max-w-7xl mx-auto px-6 grid lg:grid-cols-2 gap-12 items-center">
                            <div className="space-y-8">
                                <h2 className="text-4xl font-black italic uppercase">The <span className="text-red-500">Fuel</span> Suffering</h2>
                                <div className="p-8 glass rounded-[2.5rem]">
                                    <div className="flex justify-between mb-4">
                                        <span className="text-xs font-bold text-slate-500">Monthly Commute</span>
                                        <span className="text-xl font-black text-cyan-400">{monthlyKm} KM</span>
                                    </div>
                                    <input type="range" min="500" max="5000" step="100" value={monthlyKm} onChange={(e) => setMonthlyKm(e.target.value)} className="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-cyan-500" />
                                </div>
                                <p className="text-slate-400">By shifting to Electron-X, you eliminate maintenance and high-cost petrol, generating wealth from thin air.</p>
                            </div>
                            <div className="bg-gradient-to-br from-cyan-600 to-emerald-700 p-12 rounded-[3rem] text-black">
                                <span className="text-[10px] font-black uppercase opacity-60">Yearly Wealth Accumulation</span>
                                <div className="text-6xl font-black italic mb-4">৳{savings.yearly.toLocaleString()}</div>
                                <div className="p-4 bg-black/10 rounded-2xl text-xs font-bold">"Switching is not a luxury; it is the only way to beat inflation."</div>
                            </div>
                        </section>
                    )}

                    {/* Swarm Section */}
                    {activeTab === 'swarm' && (
                        <section className="max-w-7xl mx-auto px-6 grid lg:grid-cols-12 gap-8">
                            <div className="lg:col-span-4 space-y-4">
                                {swarm.map((agent, i) => (
                                    <button key={i} onClick={() => setAgentIdx(i)} className={`w-full p-6 text-left rounded-3xl border ${agentIdx === i ? 'bg-cyan-500/10 border-cyan-500' : 'bg-transparent border-white/5'}`}>
                                        <div className="font-black text-sm uppercase">{agent.name}</div>
                                        <div className="text-[10px] text-slate-500 font-bold">{agent.role}</div>
                                    </button>
                                ))}
                            </div>
                            <div className="lg:col-span-8 glass p-10 rounded-[3rem]">
                                <h3 className="text-3xl font-black uppercase italic mb-4">{swarm[agentIdx].role}</h3>
                                <p className="text-slate-400 text-lg mb-8 leading-relaxed">{swarm[agentIdx].desc}</p>
                                <div className="inline-block px-4 py-2 bg-white/5 rounded-full text-[10px] font-black text-cyan-400">TECH: {swarm[agentIdx].tech}</div>
                            </div>
                        </section>
                    )}

                    {/* Roadmap Section */}
                    {activeTab === 'roadmap' && (
                        <section className="max-w-7xl mx-auto px-6 grid md:grid-cols-4 gap-4">
                            {[
                                { t: "Phase 1", d: "Data Scouting & RJSC Incorporation.", c: "৳0" },
                                { t: "Phase 2", d: "Secure Partner for 3S Experience Hub.", c: "Partner Funded" },
                                { t: "Phase 3", d: "OEM Inventory (Ather/Ola) L/C Open.", c: "৳1.5Cr" },
                                { t: "Phase 4", d: "Autonomous Franchise Scaling.", c: "Royalty" }
                            ].map((step, i) => (
                                <div key={i} className="p-8 glass rounded-[2.5rem]">
                                    <div className="text-cyan-500 font-black mb-4">{step.t}</div>
                                    <p className="text-xs text-slate-500 mb-6">{step.d}</p>
                                    <div className="text-[10px] font-black uppercase p-2 bg-white/5 text-center rounded-xl">{step.c}</div>
                                </div>
                            ))}
                        </section>
                    )}

                    {/* Footer */}
                    <footer className="mt-32 border-t border-white/5 py-12 text-center">
                        <div className="text-[10px] text-slate-700 font-black tracking-[0.5em] uppercase">ELECTRON-X | AUTONOMOUS BD NODE 2026</div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
