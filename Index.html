<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electron-X | Autonomous EV Dealership System</title>
    <!-- Professional CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; scroll-behavior: smooth; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .accent-gradient { background: linear-gradient(135deg, #22d3ee 0%, #34d399 100%); }
        .text-gradient { background: linear-gradient(135deg, #22d3ee 0%, #34d399 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .dashboard-card { background: #0f172a; border: 1px solid #1e293b; transition: all 0.3s ease; }
        .dashboard-card:hover { border-color: #22d3ee; transform: translateY(-2px); }
        input[type="range"] { -webkit-appearance: none; background: #1e293b; height: 4px; border-radius: 999px; width: 100%; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #22d3ee; border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(34, 211, 238, 0.5); }
        .shimmer { background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0) 100%); background-size: 200% 100%; animation: shimmer 2s infinite; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const App = () => {
            const [view, setView] = useState('landing'); // landing, login, dashboard
            const [km, setKm] = useState(2000);
            const [isLogged, setIsLogged] = useState(false);
            const [loginData, setLoginData] = useState({ email: '', pass: '' });
            const [logs, setLogs] = useState([
                "[Sentinel] Initializing lead mining swarm...",
                "[Liaison] SRO 149 Compliance check: PASS",
                "[Nexus] 12 active inquiries on WhatsApp (Sylhet node)"
            ]);

            // Real-world Economic Data
            const ECONOMY = { petrol: 125, electricity: 12.5, iceMaint: 1400, evMaint: 180 };
            const savings = useMemo(() => {
                const ice = (km / 40) * ECONOMY.petrol + ECONOMY.iceMaint;
                const ev = (km / 35) * ECONOMY.electricity + ECONOMY.evMaint;
                return { monthly: Math.round(ice - ev), yearly: Math.round((ice - ev) * 12) };
            }, [km]);

            // Simulated AGI Logs
            useEffect(() => {
                const interval = setInterval(() => {
                    const messages = [
                        "[Sentinel] 4 new high-intent leads from Dhaka-North.",
                        "[Guardian] Unit 0x42 battery health: 98.2%. No action required.",
                        "[Nexus] Successfully booked test drive for Ola S1 Pro.",
                        "[System] Founder IP Equity validated: 25.0%"
                    ];
                    setLogs(prev => [messages[Math.floor(Math.random() * messages.length)], ...prev.slice(0, 4)]);
                }, 4000);
                return () => clearInterval(interval);
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                if(loginData.email === 'investor@electronx.com' && loginData.pass === 'Alpha2026') {
                    setIsLogged(true);
                    setView('dashboard');
                } else {
                    alert("Invalid Credentials. Please use the instructions provided.");
                }
            };

            // --- VIEW COMPONENTS ---

            const Landing = () => (
                <div className="pt-32 px-6 max-w-7xl mx-auto pb-20">
                    <section className="text-center mb-32">
                        <div className="inline-flex items-center gap-2 px-4 py-1 bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 text-[10px] font-black rounded-full mb-8">
                            <Icon name="activity" size={14} /> LIVE: NBR SRO 149 TAX HOLIDAY ACTIVE
                        </div>
                        <h1 className="text-6xl md:text-9xl font-extrabold tracking-tighter mb-8 leading-[0.8] uppercase italic">
                            Zero Cost. <br/><span className="text-gradient">Agentic Power.</span>
                        </h1>
                        <p className="max-w-3xl mx-auto text-slate-400 text-lg md:text-xl font-medium mb-12">
                            Transforming the ৳125/L fuel burden into an autonomous business empire. We trade <span className="text-white underline decoration-cyan-500 decoration-2 underline-offset-4 font-bold">Intellectual Equity</span> for investor capital.
                        </p>
                        <div className="flex flex-col md:flex-row justify-center gap-4">
                            <button onClick={() => setView('login')} className="px-10 py-4 accent-gradient text-black font-black rounded-2xl shadow-xl hover:scale-105 transition-all uppercase text-xs">Access Investor Portal</button>
                            <a href="#economics" className="px-10 py-4 glass text-white font-black rounded-2xl border border-white/10 hover:bg-white/5 transition-all uppercase text-xs flex items-center justify-center gap-2">
                                <Icon name="calculator" /> Real-Life Savings
                            </a>
                        </div>
                    </section>

                    <section id="economics" className="grid lg:grid-cols-2 gap-16 items-center py-20 border-t border-white/5">
                        <div className="space-y-6">
                            <h2 className="text-4xl font-extrabold italic uppercase">The <span className="text-red-500">Fuel</span> Suffering</h2>
                            <p className="text-slate-400 text-lg">In Bangladesh, petrol is a tax on survival. We use AI to quantify exactly how much money a family saves by switching to Electron-X.</p>
                            <div className="p-10 glass rounded-[2.5rem]">
                                <div className="flex justify-between items-center mb-6">
                                    <span className="text-xs font-black uppercase text-slate-500 tracking-widest">Monthly Travel Range</span>
                                    <span className="text-3xl font-black text-cyan-400">{km} KM</span>
                                </div>
                                <input type="range" min="500" max="5000" step="100" value={km} onChange={(e) => setKm(parseInt(e.target.value))} />
                            </div>
                        </div>
                        <div className="accent-gradient p-12 rounded-[4rem] text-black shadow-2xl relative overflow-hidden">
                            <Icon name="trending-down" size={120} className="absolute -top-10 -right-10 opacity-10" />
                            <h4 className="text-[10px] font-black uppercase tracking-[0.3em] mb-2 opacity-70">Annual Wealth Created</h4>
                            <div className="text-7xl md:text-8xl font-black italic tracking-tighter mb-4 leading-none">৳{savings.yearly.toLocaleString()}</div>
                            <p className="text-sm font-bold max-w-xs leading-relaxed opacity-80 italic italic">
                                "This is ৳{(savings.yearly * 5).toLocaleString()} in pure profit over 5 years. This is your seed fund for the next generation."
                            </p>
                        </div>
                    </section>
                </div>
            );

            const Login = () => (
                <div className="min-h-[80vh] flex items-center justify-center px-6">
                    <form onSubmit={handleLogin} className="w-full max-w-md p-10 glass rounded-[3rem] space-y-8 animate-in zoom-in duration-300">
                        <div className="text-center">
                            <h3 className="text-3xl font-black uppercase italic tracking-tighter mb-2">Investor Portal</h3>
                            <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Authorized Access Only</p>
                        </div>
                        <div className="space-y-4">
                            <div className="space-y-1">
                                <label className="text-[10px] font-black uppercase text-slate-500 ml-4">Email Address</label>
                                <input 
                                    type="email" 
                                    className="w-full bg-black/40 border border-white/5 p-4 rounded-2xl outline-none focus:border-cyan-500 transition-all text-sm" 
                                    placeholder="investor@electronx.com"
                                    required
                                    onChange={(e) => setLoginData({...loginData, email: e.target.value})}
                                />
                            </div>
                            <div className="space-y-1">
                                <label className="text-[10px] font-black uppercase text-slate-500 ml-4">Access Password</label>
                                <input 
                                    type="password" 
                                    className="w-full bg-black/40 border border-white/5 p-4 rounded-2xl outline-none focus:border-cyan-500 transition-all text-sm" 
                                    placeholder="••••••••"
                                    required
                                    onChange={(e) => setLoginData({...loginData, pass: e.target.value})}
                                />
                            </div>
                        </div>
                        <button type="submit" className="w-full py-4 accent-gradient text-black font-black uppercase rounded-2xl hover:opacity-90 transition-all">Authenticate Node</button>
                        <p className="text-center text-[9px] text-slate-600 font-bold uppercase tracking-widest">Instruction: Use investor@electronx.com / Alpha2026</p>
                    </form>
                </div>
            );

            const Dashboard = () => (
                <div className="pt-28 px-6 max-w-7xl mx-auto pb-32 animate-in fade-in duration-700">
                    <div className="flex flex-col md:flex-row justify-between items-end gap-6 mb-12">
                        <div>
                            <h2 className="text-4xl font-black uppercase italic leading-none">Portfolio <span className="text-cyan-400">Command</span></h2>
                            <p className="text-slate-500 text-[10px] font-black tracking-widest uppercase mt-2">Active Node: Dhaka-Sylhet Distribution</p>
                        </div>
                        <div className="flex gap-4">
                            <div className="px-5 py-3 glass rounded-2xl text-center min-w-[140px]">
                                <div className="text-[9px] font-bold text-slate-500 uppercase">Founder Equity</div>
                                <div className="text-lg font-black text-emerald-400">25.0%</div>
                            </div>
                            <div className="px-5 py-3 glass rounded-2xl text-center min-w-[140px]">
                                <div className="text-[9px] font-bold text-slate-500 uppercase">Partner Equity</div>
                                <div className="text-lg font-black text-cyan-400">75.0%</div>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        {/* AGI Swarm Health */}
                        <div className="dashboard-card p-8 rounded-[2.5rem] col-span-2">
                            <div className="flex items-center justify-between mb-8">
                                <h4 className="text-xs font-black uppercase tracking-widest text-slate-500 flex items-center gap-2">
                                    <Icon name="cpu" size={14} className="text-cyan-400" /> AGI Swarm Live Feed
                                </h4>
                                <span className="px-3 py-1 bg-emerald-500/10 text-emerald-400 text-[9px] font-black rounded-full uppercase">All Agents Online</span>
                            </div>
                            <div className="bg-black/50 p-6 rounded-2xl font-mono text-[11px] text-cyan-400 space-y-2 h-[150px] overflow-hidden border border-white/5">
                                {logs.map((log, i) => (
                                    <div key={i} className="flex gap-3">
                                        <span className="text-slate-600">[{new Date().toLocaleTimeString()}]</span>
                                        <span>{log}</span>
                                    </div>
                                ))}
                                <div className="animate-pulse">_</div>
                            </div>
                        </div>

                        {/* Regulatory Compliance */}
                        <div className="dashboard-card p-8 rounded-[2.5rem]">
                            <h4 className="text-xs font-black uppercase tracking-widest text-slate-500 mb-6 flex items-center gap-2">
                                <Icon name="shield-check" size={14} className="text-emerald-400" /> Legal & Policy
                            </h4>
                            <div className="space-y-4">
                                <div className="flex items-center justify-between p-3 bg-white/5 rounded-xl border border-white/5">
                                    <span className="text-[10px] font-bold uppercase">SRO 149 Tax Holiday</span>
                                    <Icon name="check" size={14} className="text-emerald-500" />
                                </div>
                                <div className="flex items-center justify-between p-3 bg-white/5 rounded-xl border border-white/5">
                                    <span className="text-[10px] font-bold uppercase">BRTA Green Plate Auth</span>
                                    <Icon name="check" size={14} className="text-emerald-500" />
                                </div>
                                <div className="flex items-center justify-between p-3 bg-white/5 rounded-xl border border-white/5">
                                    <span className="text-[10px] font-bold uppercase">EV Policy 2024 Sync</span>
                                    <Icon name="check" size={14} className="text-emerald-500" />
                                </div>
                            </div>
                            <button className="w-full mt-6 py-3 bg-white/5 border border-white/10 text-[9px] font-black uppercase rounded-xl hover:bg-white/10">View Govt Docs</button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                        {/* Financial Projection */}
                        <div className="lg:col-span-8 dashboard-card p-10 rounded-[3rem]">
                            <h4 className="text-xs font-black uppercase tracking-widest text-slate-500 mb-8">12-Month Projected Growth</h4>
                            <div className="flex items-end gap-2 h-[200px] mb-8">
                                {[35, 45, 65, 85, 120, 160, 210, 280, 360, 480, 620, 800].map((v, i) => (
                                    <div key={i} className="flex-1 bg-cyan-500/20 hover:bg-cyan-500 transition-all rounded-t-lg relative group" style={{ height: `${(v/800)*100}%` }}>
                                        <div className="absolute -top-8 left-1/2 -translate-x-1/2 text-[9px] font-bold opacity-0 group-hover:opacity-100 transition-opacity">৳{v}L</div>
                                    </div>
                                ))}
                            </div>
                            <div className="flex justify-between text-[10px] font-bold text-slate-600 uppercase tracking-widest">
                                <span>Month 01</span>
                                <span>Month 06</span>
                                <span>Month 12</span>
                            </div>
                        </div>

                        {/* Partner Focus */}
                        <div className="lg:col-span-4 dashboard-card p-10 rounded-[3rem] accent-gradient text-black">
                            <h4 className="text-[10px] font-black uppercase tracking-widest opacity-60 mb-6">Investment Focus</h4>
                            <div className="space-y-6">
                                <div>
                                    <div className="flex justify-between text-xs font-black uppercase mb-1">
                                        <span>Showroom CAPEX</span>
                                        <span>৳85.00L</span>
                                    </div>
                                    <div className="w-full bg-black/10 h-1 rounded-full"><div className="w-full bg-black h-full rounded-full"></div></div>
                                </div>
                                <div>
                                    <div className="flex justify-between text-xs font-black uppercase mb-1">
                                        <span>Inventory L/C</span>
                                        <span>৳1.50Cr</span>
                                    </div>
                                    <div className="w-full bg-black/10 h-1 rounded-full"><div className="w-full bg-black h-full rounded-full"></div></div>
                                </div>
                                <div className="pt-6 border-t border-black/10">
                                    <p className="text-[10px] font-bold italic opacity-80 leading-relaxed">
                                        "Founder contribution is 100% intellectual. Investor provides the physical infrastructure in exchange for a 75% market share."
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen">
                    <nav className="fixed top-0 w-full z-[100] glass px-6 h-20 flex items-center justify-between border-b border-white/5">
                        <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('landing')}>
                            <div className="w-10 h-10 accent-gradient rounded-xl flex items-center justify-center shadow-lg"><Zap className="text-black w-6 h-6 fill-black" /></div>
                            <div>
                                <span className="text-xl font-black tracking-tighter uppercase leading-none block">ELECTRON<span className="text-cyan-400">X</span></span>
                                <span className="text-[9px] font-bold text-slate-500 tracking-[0.3em] uppercase">Autonomous Mobility</span>
                            </div>
                        </div>
                        {isLogged ? (
                            <button onClick={() => {setIsLogged(false); setView('landing')}} className="px-6 py-2 glass text-[10px] font-black uppercase border border-white/10 rounded-full hover:bg-white/5 transition-all">Sign Out</button>
                        ) : (
                            <button onClick={() => setView('login')} className="px-6 py-2 accent-gradient text-black text-[10px] font-black uppercase rounded-full hover:opacity-90 transition-all">Investor Portal</button>
                        )}
                    </nav>

                    {view === 'landing' && <Landing />}
                    {view === 'login' && <Login />}
                    {view === 'dashboard' && <Dashboard />}

                    <footer className="py-20 border-t border-white/5 text-center mt-20">
                        <div className="text-[10px] text-slate-700 font-black tracking-[0.5em] uppercase">ELECTRON-X | BD NODE 0x2026-SYL-DHK</div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
