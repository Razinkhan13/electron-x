<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electron-X | Autonomous EV Dealership System</title>
    <!-- Professional CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; scroll-behavior: smooth; overflow-x: hidden; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .accent-gradient { background: linear-gradient(135deg, #22d3ee 0%, #34d399 100%); }
        .text-gradient { background: linear-gradient(135deg, #22d3ee 0%, #34d399 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .dashboard-card { background: #0f172a; border: 1px solid #1e293b; transition: all 0.3s ease; }
        .dashboard-card:hover { border-color: #22d3ee; transform: translateY(-2px); }
        input[type="range"] { -webkit-appearance: none; background: #1e293b; height: 4px; border-radius: 999px; width: 100%; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #22d3ee; border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(34, 211, 238, 0.5); }
        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .animate-pulse-soft { animation: pulse-soft 3s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const App = () => {
            const [view, setView] = useState('landing'); 
            const [km, setKm] = useState(2000);
            const [isLogged, setIsLogged] = useState(false);
            const [loginData, setLoginData] = useState({ email: '', pass: '' });
            const [logs, setLogs] = useState([
                "[Sentinel] Initializing lead mining swarm...",
                "[Liaison] SRO 149 Compliance check: PASS",
                "[Nexus] 12 active inquiries on WhatsApp (Dhaka Node)"
            ]);

            // Real-world Economic Research Data (Bangladesh 2026)
            const ECONOMY = { petrol: 125, electricity: 12.5, iceMaint: 1400, evMaint: 180 };
            
            const savings = useMemo(() => {
                const ice = (km / 40) * ECONOMY.petrol + ECONOMY.iceMaint;
                const ev = (km / 35) * ECONOMY.electricity + ECONOMY.evMaint;
                return { 
                    monthly: Math.round(ice - ev), 
                    yearly: Math.round((ice - ev) * 12),
                    fiveYear: Math.round((ice - ev) * 60)
                };
            }, [km]);

            // AGI Agent Log Simulation
            useEffect(() => {
                const interval = setInterval(() => {
                    const messages = [
                        "[Sentinel] 8 new high-intent leads from Facebook/BikeBD sentiment analysis.",
                        "[Guardian] Battery health check 0xEV-42: Optimal. SoC: 92%.",
                        "[Nexus] AI Sales Agent closed pre-booking for Ather 450X (Customer ID: 9283).",
                        "[Liaison] NBR SRO 149 Automated verification successful.",
                        "[System] Founder Sweat Equity (25%) validated against Digital IP."
                    ];
                    setLogs(prev => [messages[Math.floor(Math.random() * messages.length)], ...prev.slice(0, 5)]);
                }, 5000);
                return () => clearInterval(interval);
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                if(loginData.email === 'investor@electronx.com' && loginData.pass === 'Alpha2026') {
                    setIsLogged(true);
                    setView('dashboard');
                } else {
                    alert("Invalid Credentials. Check instructions.");
                }
            };

            const Navigation = () => (
                <nav className="fixed top-0 w-full z-[100] glass px-4 md:px-8 h-20 flex items-center justify-between border-b border-white/5">
                    <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('landing')}>
                        <div className="w-10 h-10 accent-gradient rounded-xl flex items-center justify-center shadow-lg">
                            <Icon name="zap" className="text-black w-6 h-6 fill-black" />
                        </div>
                        <div className="hidden sm:block">
                            <span className="text-xl font-black tracking-tighter uppercase leading-none block">ELECTRON<span className="text-cyan-400">X</span></span>
                            <span className="text-[9px] font-bold text-slate-500 tracking-[0.3em] uppercase">Autonomous Mobility</span>
                        </div>
                    </div>
                    
                    <div className="flex gap-4 md:gap-8 items-center">
                        {!isLogged && (
                            <div className="hidden md:flex gap-6 text-[10px] font-black tracking-widest text-slate-400 uppercase">
                                <a href="#economics" className="hover:text-cyan-400 transition-all">Economics</a>
                                <a href="#roadmap" className="hover:text-cyan-400 transition-all">Roadmap</a>
                            </div>
                        )}
                        {isLogged ? (
                            <button onClick={() => {setIsLogged(false); setView('landing')}} className="px-5 md:px-6 py-2 glass text-[10px] font-black uppercase border border-white/10 rounded-full hover:bg-white/5 transition-all">Sign Out</button>
                        ) : (
                            <button onClick={() => setView('login')} className="px-5 md:px-6 py-2 accent-gradient text-black text-[10px] font-black uppercase rounded-full hover:opacity-90 transition-all">Investor Portal</button>
                        )}
                    </div>
                </nav>
            );

            // --- MAIN SECTIONS ---

            const Landing = () => (
                <div className="pt-32 px-6 max-w-7xl mx-auto pb-20">
                    {/* Hero Section */}
                    <section className="text-center mb-32 relative">
                        <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-cyan-500/10 blur-[120px] rounded-full -z-10 animate-pulse-soft"></div>
                        <div className="inline-flex items-center gap-2 px-4 py-1 bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 text-[10px] font-black rounded-full mb-8">
                            <Icon name="shield-check" size={14} /> NBR SRO 149 TAX HOLIDAY COMPLIANT
                        </div>
                        <h1 className="text-5xl md:text-9xl font-extrabold tracking-tighter mb-8 leading-[0.8] uppercase italic">
                            Zero Debt. <br/><span className="text-gradient">Agentic Future.</span>
                        </h1>
                        <p className="max-w-3xl mx-auto text-slate-400 text-lg md:text-xl font-medium mb-12">
                            A zero-investment business model leveraging <span className="text-white underline decoration-cyan-500 decoration-2 underline-offset-4 font-bold">Intellectual Equity</span> to dominate the Bangladesh EV market via Ather and Ola.
                        </p>
                        <div className="flex flex-col sm:flex-row justify-center gap-4">
                            <button onClick={() => setView('login')} className="px-10 py-4 accent-gradient text-black font-black rounded-2xl shadow-xl hover:scale-105 transition-all uppercase text-xs">Enter Investor Command</button>
                            <a href="#economics" className="px-10 py-4 glass text-white font-black rounded-2xl border border-white/10 hover:bg-white/5 transition-all uppercase text-xs flex items-center justify-center gap-2">
                                <Icon name="trending-down" /> View Economic Case
                            </a>
                        </div>
                    </section>

                    {/* Economics Calculator Section */}
                    <section id="economics" className="grid lg:grid-cols-2 gap-16 items-center py-24 border-t border-white/5">
                        <div className="space-y-6">
                            <h2 className="text-4xl md:text-5xl font-extrabold italic uppercase leading-none tracking-tighter">The <span className="text-red-500 underline decoration-red-500/30 underline-offset-8">Fuel Burden</span></h2>
                            <p className="text-slate-400 text-lg leading-relaxed">
                                Commuters in Dhaka spend 30% of their net income on ৳125/L petrol and recurring maintenance. We are building the escape route.
                            </p>
                            <div className="p-10 glass rounded-[2.5rem]">
                                <div className="flex justify-between items-center mb-6">
                                    <span className="text-xs font-black uppercase text-slate-500 tracking-widest">Monthly Commute (KM)</span>
                                    <span className="text-3xl font-black text-cyan-400 italic">{km} KM</span>
                                </div>
                                <input type="range" min="500" max="5000" step="100" value={km} onChange={(e) => setKm(parseInt(e.target.value))} />
                                <div className="flex justify-between mt-4 text-[10px] font-black text-slate-600 uppercase">
                                    <span>500 KM</span>
                                    <span>5000 KM</span>
                                </div>
                            </div>
                        </div>
                        <div className="accent-gradient p-12 rounded-[4rem] text-black shadow-2xl relative overflow-hidden group">
                            <Icon name="coins" size={140} className="absolute -top-10 -right-10 opacity-10 group-hover:scale-110 transition-transform duration-700" />
                            <h4 className="text-[10px] font-black uppercase tracking-[0.3em] mb-2 opacity-70">5-Year Household Wealth Created</h4>
                            <div className="text-6xl md:text-8xl font-black italic tracking-tighter mb-4 leading-none">৳{savings.fiveYear.toLocaleString()}</div>
                            <p className="text-sm font-bold max-w-sm leading-relaxed opacity-80 italic">
                                "This creates enough liquidity to buy two brand-new EVs from savings alone. This is how we win the market."
                            </p>
                            <div className="mt-10 flex flex-wrap gap-4">
                                <div className="px-5 py-2 bg-black/10 rounded-full text-[10px] font-black uppercase border border-black/5">0% Emissions</div>
                                <div className="px-5 py-2 bg-black/10 rounded-full text-[10px] font-black uppercase border border-black/5">AGI Managed</div>
                            </div>
                        </div>
                    </section>

                    {/* AGI Swarm Description Section */}
                    <section id="swarm" className="py-24 border-t border-white/5">
                        <div className="text-center mb-16">
                            <h2 className="text-4xl md:text-5xl font-extrabold uppercase italic tracking-tighter mb-4 text-gradient">The AGI Swarm Architecture</h2>
                            <p className="text-slate-500 text-[10px] font-black tracking-[0.5em] uppercase">Zero Human Friction. Maximum Scale.</p>
                        </div>
                        <div className="grid md:grid-cols-3 gap-8">
                            {[
                                { n: "Sentinel-1", r: "Lead Mining", d: "Scrapes social sentiment from 50k monthly posts in BD. Identifies fuel-frustrated users.", t: "Llama-3 / RAG" },
                                { n: "Nexus-AI", r: "Autonomous Sales", d: "Handles unlimited concurrent WhatsApp inquiries. Closes sales using trust-building logic.", t: "GPT-4o / Twilio" },
                                { n: "Guardian-IoT", r: "Fleet Sentry", d: "Monitors hardware health. Automates battery-as-a-service swaps before downtime.", t: "TensorFlow / IoT" }
                            ].map((agent, i) => (
                                <div key={i} className="p-10 glass rounded-[3rem] hover:border-cyan-400/30 transition-all group">
                                    <div className="w-12 h-12 rounded-2xl bg-cyan-500/10 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform duration-300">
                                        <Icon name="cpu" className="text-cyan-400" />
                                    </div>
                                    <h4 className="text-xl font-black uppercase mb-2 group-hover:text-cyan-400 transition-colors">{agent.n}</h4>
                                    <p className="text-[10px] font-black text-cyan-500 mb-6 uppercase tracking-widest">{agent.r}</p>
                                    <p className="text-sm text-slate-400 leading-relaxed mb-8">{agent.d}</p>
                                    <div className="text-[9px] font-mono text-slate-600 bg-black/40 p-3 rounded-xl border border-white/5 uppercase tracking-widest">{agent.t}</div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* Roadmap Section */}
                    <section id="roadmap" className="py-24 border-t border-white/5">
                         <h2 className="text-4xl md:text-5xl font-extrabold text-center uppercase italic mb-20 tracking-tighter underline decoration-cyan-500/20 underline-offset-8">Execution Roadmap</h2>
                         <div className="grid md:grid-cols-4 gap-6">
                            {[
                                { p: "01", t: "Digital Mining", c: "৳0 (Sweat)", d: "Mine 5k leads + Incorporate under NBR SRO 149." },
                                { p: "02", t: "Equity Anchor", c: "৳85.0L", d: "Secure local partner for 3S Experience Hub in Dhaka." },
                                { p: "03", t: "OEM Gateway", c: "৳1.50Cr", d: "L/C open for Ather/Ola batch 1 inventory." },
                                { p: "04", t: "Auto-Scale", c: "Royalty", d: "Deploy AGI agents for 64-district franchise audit." }
                            ].map((s, i) => (
                                <div key={i} className="p-8 glass rounded-[2.5rem] relative group hover:bg-white/5 transition-all">
                                    <div className="absolute top-2 right-4 text-7xl font-black text-white/5 italic select-none group-hover:text-white/10 transition-colors">{s.p}</div>
                                    <h4 className="text-lg font-black uppercase mb-4 relative z-10 group-hover:text-cyan-400 transition-colors">{s.t}</h4>
                                    <p className="text-xs text-slate-500 mb-8 italic relative z-10 font-medium">"{s.d}"</p>
                                    <div className="p-3 bg-black/20 rounded-2xl flex justify-between items-center relative z-10">
                                        <span className="text-[9px] font-black text-slate-700 uppercase">Capital</span>
                                        <span className="text-[10px] font-black text-emerald-400">{s.c}</span>
                                    </div>
                                </div>
                            ))}
                         </div>
                    </section>
                </div>
            );

            const Login = () => (
                <div className="min-h-[90vh] flex items-center justify-center px-6">
                    <form onSubmit={handleLogin} className="w-full max-w-md p-10 glass rounded-[3.5rem] space-y-8 animate-in zoom-in duration-300">
                        <div className="text-center">
                            <div className="w-16 h-16 bg-cyan-500/20 rounded-2xl flex items-center justify-center mx-auto mb-6">
                                <Icon name="lock" size={32} className="text-cyan-400" />
                            </div>
                            <h3 className="text-3xl font-black uppercase italic tracking-tighter mb-2">Investor Vault</h3>
                            <p className="text-[10px] font-bold text-slate-500 uppercase tracking-[0.3em]">Credentials: investor@electronx.com / Alpha2026</p>
                        </div>
                        <div className="space-y-4">
                            <div className="space-y-1">
                                <label className="text-[10px] font-black uppercase text-slate-500 ml-4">Authentication Node</label>
                                <input 
                                    type="email" 
                                    className="w-full bg-black/40 border border-white/5 p-4 rounded-2xl outline-none focus:border-cyan-500 transition-all text-sm placeholder:text-slate-700" 
                                    placeholder="Enter secure email"
                                    required
                                    onChange={(e) => setLoginData({...loginData, email: e.target.value})}
                                />
                            </div>
                            <div className="space-y-1">
                                <label className="text-[10px] font-black uppercase text-slate-500 ml-4">Secret Protocol</label>
                                <input 
                                    type="password" 
                                    className="w-full bg-black/40 border border-white/5 p-4 rounded-2xl outline-none focus:border-cyan-500 transition-all text-sm placeholder:text-slate-700" 
                                    placeholder="Enter access code"
                                    required
                                    onChange={(e) => setLoginData({...loginData, pass: e.target.value})}
                                />
                            </div>
                        </div>
                        <button type="submit" className="w-full py-5 accent-gradient text-black font-black uppercase rounded-2xl hover:scale-[1.02] transition-all shadow-xl shadow-cyan-500/20">Sign Into Command</button>
                    </form>
                </div>
            );

            const Dashboard = () => (
                <div className="pt-28 px-6 max-w-7xl mx-auto pb-32 animate-in fade-in duration-700">
                    <div className="flex flex-col md:flex-row justify-between items-end gap-6 mb-12">
                        <div>
                            <h2 className="text-5xl font-black uppercase italic leading-none tracking-tighter">Portfolio <span className="text-gradient">Control</span></h2>
                            <p className="text-slate-500 text-[10px] font-black tracking-[0.5em] uppercase mt-3">Verified Node: 0xBD-DHK-2026</p>
                        </div>
                        <div className="flex gap-4">
                            <div className="px-6 py-4 glass rounded-[2rem] text-center min-w-[160px]">
                                <div className="text-[9px] font-bold text-slate-500 uppercase mb-1">Founder Equity</div>
                                <div className="text-2xl font-black text-emerald-400 italic">25.0%</div>
                            </div>
                            <div className="px-6 py-4 glass rounded-[2rem] text-center min-w-[160px]">
                                <div className="text-[9px] font-bold text-slate-500 uppercase mb-1">Partner Equity</div>
                                <div className="text-2xl font-black text-cyan-400 italic">75.0%</div>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-8">
                        {/* AGI Swarm Health Panel */}
                        <div className="lg:col-span-8 dashboard-card p-10 rounded-[3rem]">
                            <div className="flex items-center justify-between mb-8">
                                <h4 className="text-xs font-black uppercase tracking-widest text-slate-400 flex items-center gap-2">
                                    <Icon name="cpu" size={14} className="text-cyan-400" /> Live Agent Intelligence Feed
                                </h4>
                                <div className="flex items-center gap-2">
                                    <div className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></div>
                                    <span className="text-[9px] font-black text-emerald-400 uppercase">Autonomous Mode: ACTIVE</span>
                                </div>
                            </div>
                            <div className="bg-black/60 p-8 rounded-3xl font-mono text-[11px] text-cyan-400 space-y-3 h-[220px] overflow-hidden border border-white/5 relative">
                                <div className="absolute inset-x-0 bottom-0 h-20 bg-gradient-to-t from-black/80 to-transparent pointer-events-none"></div>
                                {logs.map((log, i) => (
                                    <div key={i} className="flex gap-4 items-start border-l border-white/10 pl-4">
                                        <span className="text-slate-600 shrink-0">[{new Date().toLocaleTimeString()}]</span>
                                        <span className="opacity-90">{log}</span>
                                    </div>
                                ))}
                                <div className="animate-pulse pl-4 border-l border-white/10 text-slate-700">_SYSTEM_WAITING_INPUT</div>
                            </div>
                        </div>

                        {/* Regulatory Scorecard */}
                        <div className="lg:col-span-4 dashboard-card p-10 rounded-[3rem] relative overflow-hidden">
                            <Icon name="scale" size={180} className="absolute -bottom-10 -right-10 opacity-[0.03]" />
                            <h4 className="text-xs font-black uppercase tracking-widest text-slate-400 mb-8 flex items-center gap-2">
                                <Icon name="award" size={14} className="text-emerald-400" /> Compliance Node
                            </h4>
                            <div className="space-y-4">
                                {[
                                    { l: "SRO 149 Tax Exemption", v: "VALID" },
                                    { l: "BRTA Green Plate Registry", v: "ACTIVE" },
                                    { l: "EV Policy 2024 Alignment", v: "SYNCED" },
                                    { l: "0% LC Margin Status", v: "ELIGIBLE" }
                                ].map((item, i) => (
                                    <div key={i} className="flex items-center justify-between p-4 bg-white/5 rounded-2xl border border-white/5 group hover:border-emerald-500/20 transition-all">
                                        <span className="text-[10px] font-black uppercase text-slate-400">{item.l}</span>
                                        <span className="text-[9px] font-black text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded uppercase">{item.v}</span>
                                    </div>
                                ))}
                            </div>
                            <button className="w-full mt-10 py-4 glass border border-white/10 text-[9px] font-black uppercase rounded-2xl hover:bg-white/10 transition-colors">Generate Legal Report</button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        {/* Financial Growth Chart (Visual) */}
                        <div className="dashboard-card p-10 rounded-[3rem] h-[400px] flex flex-col">
                            <h4 className="text-xs font-black uppercase tracking-widest text-slate-400 mb-10 flex items-center gap-2">
                                <Icon name="bar-chart-3" size={14} className="text-blue-400" /> Revenue Forecast (12 Months)
                            </h4>
                            <div className="flex items-end gap-3 flex-1 pb-4">
                                {[30, 42, 58, 80, 110, 150, 200, 260, 330, 420, 550, 720].map((v, i) => (
                                    <div key={i} className="flex-1 bg-gradient-to-t from-cyan-600/40 to-cyan-400 hover:scale-x-110 transition-all rounded-t-lg relative group cursor-pointer" style={{ height: `${(v/720)*100}%` }}>
                                        <div className="absolute -top-10 left-1/2 -translate-x-1/2 bg-white text-black p-2 rounded-lg text-[10px] font-black opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap shadow-xl">
                                            ৳{v}L REV
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <div className="flex justify-between text-[10px] font-black text-slate-600 uppercase tracking-widest mt-4">
                                <span>Q1 Launch</span>
                                <span>Q2 Scale</span>
                                <span>Q4 Dominance</span>
                            </div>
                        </div>

                        {/* Capital Disbursement Panel */}
                        <div className="dashboard-card p-10 rounded-[3rem] accent-gradient text-black flex flex-col justify-between">
                            <div>
                                <h4 className="text-[10px] font-black uppercase tracking-[0.3em] opacity-60 mb-10">Capex Allocations</h4>
                                <div className="space-y-8">
                                    <div>
                                        <div className="flex justify-between text-xs font-black uppercase mb-2">
                                            <span>3S Hub Development</span>
                                            <span>৳85.00L</span>
                                        </div>
                                        <div className="w-full bg-black/10 h-1.5 rounded-full overflow-hidden">
                                            <div className="w-full bg-black h-full"></div>
                                        </div>
                                    </div>
                                    <div>
                                        <div className="flex justify-between text-xs font-black uppercase mb-2">
                                            <span>Ather/Ola Inventory L/C</span>
                                            <span>৳1.50Cr</span>
                                        </div>
                                        <div className="w-full bg-black/10 h-1.5 rounded-full overflow-hidden">
                                            <div className="w-full bg-black h-full"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="pt-10 border-t border-black/10">
                                <div className="flex items-start gap-3">
                                    <Icon name="info" className="shrink-0 mt-1 opacity-60" />
                                    <p className="text-[10px] font-bold italic leading-relaxed opacity-80 uppercase tracking-tight">
                                        Note: Founder provides 100% Digital IP, AGI Swarm Management, and Policy Liaison. Investor covers all Physical Infrastructure.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen">
                    <Navigation />

                    {view === 'landing' && <Landing />}
                    {view === 'login' && <Login />}
                    {view === 'dashboard' && <Dashboard />}

                    <footer className="py-24 border-t border-white/5 text-center bg-[#010103] relative">
                         <div className="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-12">
                             <div className="text-left">
                                <div className="flex items-center gap-3 mb-4">
                                    <Icon name="zap" className="text-cyan-500" />
                                    <span className="text-xl font-black tracking-tighter uppercase">ELECTRON-X</span>
                                </div>
                                <p className="text-[10px] text-slate-600 font-bold uppercase tracking-[0.4em] max-w-sm leading-relaxed">
                                    The Autonomous Infrastructure of Bangladesh's Future Mobility. Built with 0% Debt. Managed by AGI.
                                </p>
